# Development Profile - MySQL Database (same as default, with debug logging)
server.port=8081
server.servlet.context-path=/api
spring.application.name=qr-order

# MySQL Database (same datasource as production)
spring.datasource.url=jdbc:mysql://localhost:3306/qr_code?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (verbose for development)
logging.level.root=INFO
logging.level.com.qrorder=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
